<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperar senha</title>
  <style>
    :root{--bg:#0b1220;--card:#121a2b;--text:#e8eefc;--muted:#a8b3d6;--primary:#4f8cff;--border: rgba(255,255,255,.12);--danger:#ff5a6a;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:100%;max-width:420px;background:rgba(18,26,43,.85);border:1px solid var(--border);border-radius:16px;padding:24px;}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0 0 20px;color:var(--muted);font-size:14px}
    label{display:block;margin:14px 0 8px;font-size:13px;color:var(--muted)}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);outline:none}
    input:focus{border-color: rgba(79,140,255,.75);box-shadow: 0 0 0 4px rgba(79,140,255,.15);}
    button{width:100%;margin-top:18px;padding:12px 14px;border:none;border-radius:12px;background:linear-gradient(90deg,#4f8cff,#6a5cff);color:#fff;font-weight:700;cursor:pointer}
    .alert{margin-top:14px;padding:10px 12px;border-radius:12px;display:none}
    .alert.error{display:block;background:rgba(255,90,106,.12);border:1px solid rgba(255,90,106,.35);color:#ffd5d9}
    .alert.ok{display:block;background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.35);color:#d8e6ff}
    a{color:var(--primary);text-decoration:none;font-size:13px}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="card">
    <h1>Recuperar senha ✉️</h1>
    <p>Informe seu e-mail. Enviaremos um link/código para redefinir sua senha.</p>

    <form id="form" novalidate>
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@email.com" />

      <button id="btn" type="submit">Enviar instruções</button>

      <div id="alert" class="alert" role="alert"></div>

      <div style="margin-top:14px;">
        <a href="/login.html">Voltar ao login</a>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const alertBox = document.getElementById('alert');

    const show = (type, msg) => {
      alertBox.className = 'alert ' + type;
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const email = form.email.value.trim();
      if(!email) return;

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try{
        // ✅ ajuste para sua rota real
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email })
        });

        if(!res.ok){
          let msg = 'Não foi possível enviar as instruções.';
          try{
            const data = await res.json();
            if(data?.message) msg = data.message;
          }catch{}
          show('error', msg);
          return;
        }

        show('ok', 'Se o e-mail existir, enviaremos as instruções em instantes.');
      }catch{
        show('error', 'Erro de conexão. Tente novamente.');
      }finally{
        btn.disabled = false;
        btn.textContent = 'Enviar instruções';
      }
    });
  </script>
</body>
</html>
