<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Área Restrita</title>
  <style>
    :root{--bg:#0b1220;--card:#121a2b;--text:#e8eefc;--muted:#a8b3d6;--primary:#4f8cff;--border: rgba(255,255,255,.12);}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:100%;max-width:420px;background:rgba(18,26,43,.85);border:1px solid var(--border);border-radius:16px;padding:24px;}
    h1{margin:0 0 8px;font-size:22px}
    p{margin:0 0 20px;color:var(--muted);font-size:14px}
    label{display:block;margin:14px 0 8px;font-size:13px;color:var(--muted)}
    input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);outline:none}
    input:focus{border-color: rgba(79,140,255,.75);box-shadow: 0 0 0 4px rgba(79,140,255,.15);}
    a{color:var(--primary);text-decoration:none;font-size:13px}
    a:hover{text-decoration:underline}
    button{width:100%;margin-top:18px;padding:12px 14px;border:none;border-radius:12px;background:linear-gradient(90deg,#4f8cff,#6a5cff);color:#fff;font-weight:700;cursor:pointer}
    .alert{margin-top:14px;padding:10px 12px;border-radius:12px;display:none}
    .alert.error{display:block;background:rgba(255,90,106,.12);border:1px solid rgba(255,90,106,.35);color:#ffd5d9}
    .small{margin-top:16px;color:var(--muted);font-size:12.5px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Entrar na área restrita 🔐</h1>
    <p>Informe seu usuário/e-mail e sua senha.</p>

    <form id="loginForm" novalidate>
      <label for="identifier">Usuário ou e-mail</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" required>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <div style="margin-top:12px;">
        <a href="/esqueci-minha-senha.html">Esqueci minha senha</a>
      </div>

      <button id="submitBtn" type="submit">Entrar</button>
      <div id="alert" class="alert" role="alert"></div>

      <p class="small">
        Não tem conta? <a href="/cadastro.html"><strong>Cadastre-se</strong></a>
      </p>
    </form>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alert');

    const showError = (msg) => {
      alertBox.className = 'alert error';
      alertBox.textContent = msg;
      alertBox.style.display = 'block';
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const identifier = form.identifier.value.trim();
      const password = form.password.value;

      if(!identifier || !password) return showError('Preencha usuário/e-mail e senha.');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      try {
        // ✅ ajuste para sua rota real
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ identifier, password })
        });

        if(!res.ok){
          let msg = 'Falha ao fazer login.';
          try{
            const data = await res.json();
            if(data?.message) msg = data.message;
          }catch{}
          showError(msg);
          return;
        }

        // Se sua autenticação usar cookie/sessão, a API já setará cookie.
        // Redireciona para o tema:
        window.location.href = '/tema.html';

      } catch {
        showError('Erro de conexão. Tente novamente.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
